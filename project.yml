name: ChessHelper
options:
  bundleIdPrefix: com.chesshelper
  deploymentTarget:
    iOS: "15.0"
targets:
  ChessHelper:
    type: application
    platform: iOS
    sources: 
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.chesshelper.app
        CODE_SIGN_ENTITLEMENTS: Sources/ChessHelper.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
