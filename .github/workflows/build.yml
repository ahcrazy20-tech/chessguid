name: Build ChessHelper TrollStore IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate App Icon
        run: |
          mkdir -p Sources/Resources/Assets.xcassets/AppIcon.appiconset
          # Create a simple green chess pawn icon using Python
          python3 -c "
          import base64, os
          # Base64 of a simple 1024x1024 green circle with white pawn
          icon_b64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
          # For a real icon, we will use a solid green color for now to ensure it builds
          # In a real app, you would upload a real PNG. This is a placeholder.
          import struct, zlib
          def create_png(size, color):
              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
              row = b'\x00' + bytes(color) * size
              idat = chunk(b'IDAT', zlib.compress(row * size))
              iend = chunk(b'IEND', b'')
              return header + ihdr + idat + iend
          png = create_png(1024, [0, 200, 0]) # Green background
          with open('Sources/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png', 'wb') as f:
              f.write(png)
          "
          # Create Contents.json for the icon
          echo '{"images":[{"idiom":"universal","platform":"ios","size":"1024x1024","filename":"AppIcon.png"}],"info":{"version":1,"author":"xcode"}}' > Sources/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo '{"info":{"version":1,"author":"xcode"}}' > Sources/Resources/Assets.xcassets/Contents.json

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App
        run: |
          xcodebuild -project ChessHelper.xcodeproj \
                     -scheme ChessHelper \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Download ldid for Signing
        run: |
          curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64 -o ldid
          chmod +x ldid

      - name: Sign App with TrollStore Entitlements
        run: |
          ./ldid -SSources/ChessHelper.entitlements build/Build/Products/Release-iphoneos/ChessHelper.app

      - name: Package into IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/ChessHelper.app Payload/
          zip -r ChessHelper.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-TrollStore-IPA
          path: ChessHelper.ipa
